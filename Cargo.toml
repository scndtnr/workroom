[package]
name = "workroom"
version = "0.2.0-beta.2"
edition = "2024"
rust-version = "1.88"
description = "AI エージェント（Claude Code / Codex など）に日付付きの作業部屋を用意する CLI"
license = "MIT"
repository = "https://github.com/scndtnr/workroom"
readme = "README.md"
keywords = ["cli", "ai-agent", "claude", "codex", "workspace"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "unicode"] }
dirs = "7"
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "symbols"
lto = true
