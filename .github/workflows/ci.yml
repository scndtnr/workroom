name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 検証 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust を準備
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable ブランチ
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Rust のキャッシュ
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: フォーマットを確認
        run: cargo fmt --check
      - name: Clippy を実行
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: テストを実行
        run: cargo test --locked

  msrv:
    name: Rust 1.88 で検証
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust を準備
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable ブランチ
        with:
          toolchain: '1.88'
      - name: 最小 Rust バージョンを確認
        run: cargo check --all-targets --locked
