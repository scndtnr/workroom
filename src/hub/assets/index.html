<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>workroom hub</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <header class="app-header">
    <button id="sidebar-toggle" type="button" aria-controls="rooms" aria-expanded="true" title="部屋の一覧を畳む" aria-label="部屋の一覧を畳む">◀</button>
    <strong id="root" class="brand">workroom <span>hub</span></strong>
    <nav aria-label="ページ">
      <button type="button" data-page="rooms">部屋</button>
      <button type="button" data-page="questions" title="全部屋の確認事項">確認事項</button>
      <button type="button" data-page="archive">アーカイブ</button>
    </nav>
    <form id="filters" aria-label="表示条件">
      <select id="mode" aria-label="表示する部屋"><option value="recent">進行中</option><option value="all">全件</option><option value="old">古い未完了</option></select>
      <label>期間 <input id="days" type="number" step="1" aria-label="日数">日</label>
      <input id="query" type="search" aria-label="部屋名・説明を検索" placeholder="部屋名・説明">
      <select id="sort" aria-label="並び順"><option value="date">新しい順</option><option value="updated">更新順</option><option value="unanswered">未回答順</option></select>
      <label><input id="unanswered" type="checkbox">未回答あり</label>
    </form>
    <div class="hub-actions" role="group" aria-label="表示の操作">
      <button id="reload" type="button" title="再読み込み" aria-label="再読み込み">⟳</button>
      <button id="theme" type="button" title="配色を切り替える" aria-label="配色を切り替える">◐</button>
    </div>
    <p id="notice" role="status" aria-live="polite" hidden></p>
  </header>
  <main id="layout">
    <aside id="rooms" aria-label="部屋の一覧"></aside>
    <article id="content" aria-label="部屋・成果物・確認事項"></article>
  </main>
  <noscript>成果物ハブを表示するには JavaScript を有効にしてください。</noscript>
</body>
</html>
